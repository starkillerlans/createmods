# Brand strings treated as "vanilla" and exempt from needing ClientID.
vanilla-brands:
  - vanilla

# The exact plugin channel ClientID's companion mod registers.
# PLACEHOLDER - you must fill this in yourself. Join with a modded
# test client that has ClientID installed, then run:
#   /modgate channels <yourtestaccount>
# and copy the channel that ClientID registers into this value.
clientid-channel: "clientid:charts"

# Ticks to wait after join before checking brand/channels (20 ticks = 1 second).
# Plugin channel registration isn't instant - give it a moment.
grace-period-ticks: 40

# Shown to modded (fabric/forge/neoforge) players who fail the check.
kick-message: "&cYou're joining with a modded client (Fabric/Forge/NeoForge).\n&7Here is an tutorial on how you can join with mods: https://manual.fusionsmp.eu"
